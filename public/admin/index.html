<title>Xport · Licencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #f8fafc;
  --bg-subtle: #f1f5f9;
  --panel: #ffffff;
  --panel-elevated: #ffffff;
  --ink: #0f172a;
  --ink-secondary: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --brand: #005bae;
  --brand-hover: #004c93;
  --brand-ink: #ffffff;
  --teal: #00afb7;
  --ok: #059669;
  --ok-bg: #ecfdf5;
  --ok-border: #a7f3d0;
  --warn: #d97706;
  --warn-bg: #fffbeb;
  --warn-border: #fde68a;
  --bad: #dc2626;
  --bad-bg: #fef2f2;
  --bad-border: #fecaca;
  --idle: #64748b;
  --idle-bg: #f1f5f9;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  --shadow-lg: 0 12px 24px -4px rgb(0 0 0 / 0.08), 0 4px 6px -2px rgb(0 0 0 / 0.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg: #090d16;
  --bg-subtle: #0f172a;
  --panel: #111827;
  --panel-elevated: #1e293b;
  --ink: #f8fafc;
  --ink-secondary: #cbd5e1;
  --muted: #94a3b8;
  --line: #1e293b;
  --line-strong: #334155;
  --brand: #38bdf8;
  --brand-hover: #7dd3fc;
  --brand-ink: #031a35;
  --teal: #2dd4bf;
  --ok: #34d399;
  --ok-bg: #064e3b33;
  --ok-border: #065f46;
  --warn: #fbbf24;
  --warn-bg: #78350f33;
  --warn-border: #92400e;
  --bad: #f87171;
  --bad-bg: #7f1d1d33;
  --bad-border: #991b1b;
  --idle: #94a3b8;
  --idle-bg: #1e293b;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.4);
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
  --shadow-lg: 0 12px 28px -4px rgb(0 0 0 / 0.5);
}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.025em}
.hidden{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace}

/* login */
.login{
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--brand) 12%, transparent), transparent 65%), var(--bg);
}
.login form{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow-lg);
  padding: 36px 32px;
  width: 100%;
  max-width: 400px;
  display: grid;
  gap: 18px;
}
.login-header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login-header img{width:36px;height:36px;object-fit:contain}
.login h1{font-size:22px;letter-spacing:-0.03em}
.login-sub{color:var(--muted);font-size:13px;margin:-8px 0 6px}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 10;
}
.brand{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 10px 20px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -0.03em;
}
.brand img{width:30px;height:30px;object-fit:contain}
.brand small{
  display: inline-block;
  font-weight: 600;
  color: var(--teal);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.brand-badge{
  margin-left: auto;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 99px;
  background: var(--idle-bg);
  color: var(--muted);
  border: 1px solid var(--line);
}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{
  all: unset;
  cursor: pointer;
  padding: 10px 14px;
  border-radius: 10px;
  color: var(--muted);
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.15s ease;
}
.nav button svg{width:18px;height:18px;stroke-width:2;opacity:0.8;transition:transform 0.15s ease}
.nav button:hover{
  background: var(--idle-bg);
  color: var(--ink);
}
.nav button:hover svg{transform:translateX(2px)}
.nav button[aria-current=page]{
  background: color-mix(in srgb, var(--brand) 12%, var(--panel));
  color: var(--brand);
  font-weight: 700;
  box-shadow: inset 3px 0 0 var(--brand);
}
.nav button[aria-current=page] svg{opacity:1;color:var(--brand)}
.nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}
.spacer{flex:1}
.sidebar-footer{
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.server-status{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  padding: 0 8px;
}
.status-dot{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
  animation: pulse-dot 2.5s infinite;
}
@keyframes pulse-dot{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.15);opacity:0.75}
}

main{
  padding: 32px 40px;
  max-width: 1360px;
  width: 100%;
}
.head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.head h2{
  font-size: 26px;
  letter-spacing: -0.035em;
  font-weight: 800;
}

/* controls */
.btn{
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 9px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
.btn:hover{
  background: var(--idle-bg);
  border-color: var(--line-strong);
  transform: translateY(-1px);
}
.btn.primary{
  background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 85%, #00afb7));
  border-color: transparent;
  color: #ffffff;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--brand) 30%, transparent);
}
.btn.primary:hover{
  filter: brightness(1.1);
  box-shadow: 0 6px 16px color-mix(in srgb, var(--brand) 45%, transparent);
  transform: translateY(-1px);
}
.btn.danger{
  color: var(--bad);
  border-color: var(--bad-border);
  background: var(--bad-bg);
}
.btn.danger:hover{
  background: color-mix(in srgb, var(--bad-bg) 80%, var(--bad));
  border-color: var(--bad);
  color: #fff;
}
.btn.small{padding: 6px 12px; font-size: 12px; border-radius: 8px}
.btn[disabled]{opacity: 0.5; cursor: not-allowed; transform: none!important; box-shadow: none}

label{
  display: grid;
  gap: 6px;
  font-weight: 600;
  font-size: 12.5px;
  color: var(--ink-secondary);
}
input,select,textarea{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  width: 100%;
  font-weight: 500;
  font-size: 13.5px;
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus,select:focus,textarea:focus{
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
  outline: none;
}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 150px}
.row>.fixed{flex:0 0 auto}
.err{color:var(--bad);font-weight:600;min-height:1.2em;font-size:12.5px}

/* cards & table */
.cards{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.card{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  position: relative;
  overflow: hidden;
}
.card::before{
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--brand), var(--teal));
  opacity: 0;
  transition: opacity 0.2s;
}
.card:hover{
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
}
.card:hover::before{opacity: 1}
.card .n{
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.1;
  margin-top: 6px;
  color: var(--ink);
}
.card .l{
  color: var(--muted);
  font-weight: 600;
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.panel{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.panel>h3{
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  background: var(--bg-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  background: var(--bg-subtle);
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer;transition:background-color 0.15s ease}
tbody tr.click:hover{background:color-mix(in srgb, var(--brand) 4%, var(--panel))}

.empty{padding:48px 20px;text-align:center;color:var(--muted);font-weight:500}

.badge{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
}
.badge::before{
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.badge.active{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.badge.expiring{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.badge.expired,.badge.revoked{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border)}
.badge.suspended,.badge.released{background:var(--idle-bg);color:var(--idle);border:1px solid var(--line)}

.toolbar{
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  align-items: center;
}
.toolbar input{max-width:320px}
.toolbar select{max-width:220px}
.pager{
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 18px;
  border-top: 1px solid var(--line);
  background: var(--bg-subtle);
}

/* modal / drawer */
.overlay{
  position: fixed;
  inset: 0;
  background: rgba(3, 26, 53, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 100;
  animation: fadeIn 0.2s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{place-items:stretch end;padding:0}
.modal{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow: auto;
  padding: 28px;
  display: grid;
  gap: 16px;
  animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes popIn{from{transform:scale(0.96);opacity:0}to{transform:scale(1);opacity:1}}
.drawer .modal{
  max-width: 680px;
  max-height: none;
  height: 100%;
  border-radius: 0;
  border-width: 0 0 0 1px;
  animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.modal h3{font-size:20px;letter-spacing:-0.03em}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.keybox{
  background: var(--bg-subtle);
  border: 1.5px dashed color-mix(in srgb, var(--brand) 40%, var(--line));
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.06em;
  user-select: all;
  word-break: break-all;
  color: var(--brand);
}
.kv{
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 18px;
  background: var(--bg-subtle);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600}
.section-title{
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 750;
  margin-top: 10px;
}
.toast{
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #031a35;
  color: #f8fafc;
  padding: 12px 20px;
  border-radius: 99px;
  z-index: 150;
  font-weight: 600;
  font-size: 13px;
  box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  gap: 8px;
}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{
    position: static;
    height: auto;
    flex-direction: row;
    align-items: center;
    flex-wrap: wrap;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 16px;
  }
  .brand{padding:0 8px 0 0;margin:0;border:0}
  .nav{flex-direction:row;flex-wrap:wrap}
  .spacer{display:none}
  .sidebar-footer{flex-direction:row;align-items:center;padding:0;border:0;margin-left:auto}
  main{padding:20px 16px}
}
</style>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 86400;
const fmtDate = (s) => s ? new Date(s * 1000).toLocaleDateString('es', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtDateTime = (s) => s ? new Date(s * 1000).toLocaleString('es', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const daysLeft = (s) => Math.ceil((s - Date.now() / 1000) / DAY);
const fmtLeft = (s) => {
  const sec = Math.floor(s - Date.now() / 1000);
  if (sec <= 0) return 'vencida';
  if (sec < 3600) return Math.max(1, Math.ceil(sec / 60)) + ' min';
  if (sec < DAY) return Math.ceil(sec / 3600) + ' h';
  return Math.ceil(sec / DAY) + ' días';
};
const fmtMoney = (cents, cur) => ((cur || 'PEN') === 'PEN' ? 'S/ ' : (cur + ' ')) + (cents / 100).toLocaleString('es', { minimumFractionDigits: cents % 100 === 0 ? 0 : 2, maximumFractionDigits: 2 });
const ORDER_LABEL = { pending: 'Pendiente', processing: 'Verificando pago', paid: 'Pagado', cancelled: 'Cancelado' };
const orderBadge = (st) => `<span class="badge ${st === 'paid' ? 'active' : (st === 'pending' || st === 'processing') ? 'expiring' : 'suspended'}">${esc(ORDER_LABEL[st] || st)}</span>`;
const STATE_LABEL = { active: 'Activa', expiring: 'Por vencer', expired: 'Vencida', suspended: 'Suspendida', revoked: 'Revocada', released: 'Liberado' };

async function api(path, { method = 'GET', body } = {}) {
  const res = await fetch('/admin/api' + path, {
    method,
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'bimflow' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401 && path !== '/login') { showLogin(); throw new Error('Sesión expirada'); }
  const data = await res.json().catch(() => ({ ok: false, error: 'Respuesta inválida' }));
  if (!res.ok || data.ok === false) throw new Error(data.error || 'Error ' + res.status);
  return data;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  $('#toastRoot').append(el);
  setTimeout(() => el.remove(), 2600);
}


function confirmDialog(message, { danger = false, okLabel = 'Confirmar' } = {}) {
  return new Promise((resolve) => {
    let settled = false;
    const m = openModal(`<h3>Confirmar</h3><p>${esc(message)}</p>
      <div class="actions"><button class="btn" id="no">Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" id="yes">${esc(okLabel)}</button></div>`,
      { onClose: () => { if (!settled) resolve(false); } });
    m.$('#no').onclick = () => m.close();
    m.$('#yes').onclick = () => { settled = true; m.close(); resolve(true); };
  });
}
function askDays() {
  return new Promise((resolve) => {
    let settled = false;
    const m = openModal(`<h3>Extender licencia</h3>
      <p class="muted">Se suma a la fecha de vencimiento actual, o a ahora si ya venció.</p>
      <div class="row"><label>Cantidad <input id="amount" type="number" min="1" value="365"></label>

/* ---------- modal helper ---------- */
function openModal(html, { drawer = false, onClose } = {}) {
  const previous = document.activeElement;
  const root = document.createElement('div');
  root.className = 'overlay' + (drawer ? ' drawer' : '');
  root.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Administración de Xport" tabindex="-1">${html}</div>`;
  const close = () => { root.remove(); document.removeEventListener('keydown', onKey); if(previous?.isConnected)previous.focus(); onClose && onClose(); };
  const onKey = (e) => {
    if ([...document.querySelectorAll('.overlay')].at(-1) !== root) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    if (e.key === 'Tab') {
      const focusable=[...root.querySelectorAll('button:not(:disabled),input:not(:disabled):not([type=hidden]),select:not(:disabled),textarea:not(:disabled),a[href],summary')].filter(el=>el.getClientRects().length);
      const first=focusable[0], last=focusable.at(-1);
      if(!first){e.preventDefault();root.querySelector('.modal').focus();}
      else if(e.shiftKey&&(document.activeElement===first||!root.contains(document.activeElement))){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&(document.activeElement===last||!root.contains(document.activeElement))){e.preventDefault();first.focus();}
    }
  };
  root.addEventListener('mousedown', (e) => { if (e.target === root) close(); });
  document.addEventListener('keydown', onKey);
  $('#modalRoot').append(root);
  const first = root.querySelector('input,select,textarea,button');
  (first || root.querySelector('.modal')).focus();
  return { root, close, $: (s) => root.querySelector(s) };
}

function showKey(key, title) {
  const m = openModal(`
    <h3>${esc(title)}</h3>
    <p class="muted">Copia la clave para activar Xport. Si la licencia está vinculada a una cuenta, su dueño también puede consultarla en el portal.</p>
    <div class="keybox mono">${esc(key)}</div>
    <div class="actions"><button class="btn" id="copyKey">Copiar clave</button><button class="btn primary" id="doneKey">Listo</button></div>`);
  m.$('#copyKey').onclick = async () => { try { await navigator.clipboard.writeText(key); toast('Clave copiada'); } catch { toast('Seleccione y copie manualmente'); } };
  m.$('#doneKey').onclick = m.close;
}

/* ---------- auth ---------- */
function showLogin() {
  // Preserve the original recovery access while using the common login by default.
  if (new URLSearchParams(location.search).get('recovery') !== '1') { location.replace('/portal/'); return; }
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#password').focus();
  fetch('/portal/api/oauth/providers', { credentials: 'same-origin' }).then((r) => r.json()).then((r) => {
    if ((r.providers || []).includes('google')) { $('#loginGoogle').innerHTML = GOOGLE_LOGO + 'Continuar con Google'; $('#loginSocial').classList.remove('hidden'); }
  }).catch(() => {});
}
function showApp() { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  try {
    await api('/login', { method: 'POST', body: { password: $('#password').value } });
    $('#password').value = '';
    showApp(); route();
  } catch (err) { $('#loginErr').textContent = err.message; }
});
$('#logout').onclick = async () => { await api('/logout', { method: 'POST' }).catch(() => {}); showLogin(); };

/* ---------- router ---------- */
const state = { view: 'dashboard', customers: { q: '', page: 0 }, lic: { q: '', state: '', page: 0 }, ev: { type: '', page: 0 }, ord: { status: 'pending', page: 0 } };
document.querySelectorAll('.nav button').forEach((b) => b.addEventListener('click', () => { state.view = b.dataset.view; route(); }));

async function route() {
  document.querySelectorAll('.nav button').forEach((b) => { if (b.dataset.view === state.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const view = $('#view');
  view.innerHTML = '<p class="muted">Cargando…</p>';
  try {
    if (state.view === 'dashboard') await renderDashboard(view);
    else if (state.view === 'customers') await renderCustomers(view);
    else if (state.view === 'licenses') await renderLicenses(view);
    else if (state.view === 'orders') await renderOrders(view);
    else await renderEvents(view);
  } catch (err) { if (err.message !== 'Sesión expirada') view.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

}

function setupCustomerPicker(m, initial) {
  let timer, seq=0;
  const input=m.$('#licenseCustomerSearch'), results=m.$('#customerResults'), linked=m.$('#linkAccount');
  function select(c){m.$('[name=customerId]').value=c.id;input.value=c.name+' · '+c.email;m.$('[name=customerName]').value=c.name;m.$('[name=customerEmail]').value=c.email;results.innerHTML='';m.$('#customerSelected').textContent='Vinculada a '+c.email+'. Se mostrará en su portal. No desactiva sus licencias anteriores.';}
  function mode(){seq++;results.innerHTML='';m.$('#customerPicker').classList.toggle('hidden',!linked.checked);for(const key of ['customerName','customerEmail'])m.$('[name='+key+']').readOnly=linked.checked;if(!linked.checked){m.$('[name=customerId]').value='';m.$('#customerSelected').textContent='Licencia manual sin cuenta de portal vinculada.';}else if(initial)select(initial);}
  linked.onchange=mode;mode();
  input.oninput=()=>{clearTimeout(timer);const current=++seq;m.$('[name=customerId]').value='';m.$('#customerSelected').textContent='Selecciona una cuenta de los resultados.';results.textContent='Buscando…';timer=setTimeout(async()=>{try{const d=await api('/customers?'+new URLSearchParams({q:input.value}));if(current!==seq||!m.root.isConnected)return;results.innerHTML=d.customers.length?d.customers.map(c=>`<button type="button" data-id="${esc(c.id)}"><b>${esc(c.name)}</b><small>${esc(c.email)}${c.company?' · '+esc(c.company):''}</small></button>`).join(''):'<p class="muted">Sin resultados. El cliente puede crear su cuenta en el portal.</p>';results.querySelectorAll('button').forEach(b=>b.onclick=()=>{seq++;select(d.customers.find(c=>c.id===b.dataset.id));});}catch(err){if(current===seq)results.textContent=err.message;}},250);};
  input.onfocus=()=>{if(!m.$('[name=customerId]').value)input.oninput();};
}

/* Instalador que descargan los clientes (portal y guía de instalación) */
async function loadInstaller() {
  const panel = $('#instPanel');
  if (!panel) return;
  let info = null;
  try { info = (await api('/installer')).installer; } catch { /* sin datos */ }
  panel.innerHTML = `<div class="installer-intro"><span class="installer-icon">${adminGlyph('download')}</span><div><p class="admin-kicker">DISTRIBUCIÓN DEL COMPLEMENTO</p><h3>La última versión, en manos de tus clientes.</h3><p class="muted">Publica el instalador que se descarga desde el portal y la guía.</p></div>${info?'<span class="badge active">Publicado</span>':'<span class="badge expiring">Sin publicar</span>'}</div><div class="installer-body">
    <div class="installer-current">${info?`<span class="version-chip">${info.version?'v'+esc(info.version):'Sin versión'}</span><h4>Xport para Revit</h4><p class="muted">${(info.size/1048576).toFixed(1)} MB · ${fmtDateTime(info.uploadedAt)}</p><a class="installer-download" href="${esc(info.url)}" target="_blank" rel="noopener">${adminGlyph('download')} Descargar versión publicada</a><details class="installer-hash"><summary>Ver huella de integridad SHA-256</summary><code>${esc(info.sha256)}</code></details>`:'<h4>Prepara tu primera publicación</h4><p class="muted">El instalador estará disponible para tus clientes cuando publiques un archivo.</p>'}</div>
    <div class="installer-upload"><label class="upload-zone" for="instFile">${adminGlyph('download')}<b>Selecciona el nuevo instalador</b><span>Archivo .exe de GitHub Actions</span></label><input class="upload-input" type="file" id="instFile" accept=".exe"><div class="upload-file" id="instFileName" aria-live="polite">Ningún archivo seleccionado</div><button class="btn primary" id="instUp">Publicar instalador ${adminGlyph('arrow')}</button><p class="muted">Reemplaza la versión publicada. La huella SHA-256 se calcula al subir el archivo.</p><div class="err" id="instErr" role="alert"></div></div></div>`;
  $('#instFile').onchange=e=>{$('#instFileName').textContent=e.target.files[0]?.name||'Ningún archivo seleccionado';};
  $('#instUp').onclick = async () => {
    const f = $('#instFile').files[0];
    $('#instErr').textContent = '';
    if (!f) { $('#instErr').textContent = 'Seleccione el archivo .exe.'; return; }
    if (!await confirmDialog('Se publicará «' + f.name + '» para todos los clientes y reemplazará al instalador actual.', { okLabel: 'Publicar' })) return;
    $('#instUp').disabled = true; $('#instUp').textContent = 'Subiendo…';
    try {
      const res = await fetch('/admin/api/installer?name=' + encodeURIComponent(f.name), {
        method: 'POST', credentials: 'same-origin', body: f,
        headers: { 'Content-Type': 'application/octet-stream', 'X-Requested-With': 'bimflow' },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.error || 'Error ' + res.status);
      toast('Instalador publicado');
      loadInstaller();
    } catch (err) { $('#instErr').textContent = err.message; $('#instUp').disabled = false; $('#instUp').textContent = 'Publicar instalador'; }
  };
}

function toDateInput(sec) { return new Date(sec * 1000).toISOString().slice(0, 10); }
function endOfDay(dateStr) { return Math.floor(new Date(dateStr + 'T23:59:59Z').getTime() / 1000); }

function openCreate(customer = null) {
  const m = openModal(`
    <h3>Nueva licencia</h3>
    <form id="f" style="display:grid;gap:12px">
      <div class="license-assignment"><label class="assignment-check"><input type="checkbox" id="linkAccount" checked> Vincular a un usuario registrado</label><input type="hidden" name="customerId"><div id="customerPicker"><label>Buscar usuario<input id="licenseCustomerSearch" type="search" autocomplete="off" placeholder="Nombre, correo o empresa"></label><div id="customerResults" class="customer-search-results" role="group" aria-label="Usuarios encontrados"></div></div><p class="muted" id="customerSelected" aria-live="polite">Busca y selecciona la cuenta que recibirá esta licencia.</p></div>
      <label>Cliente <input name="customerName" required maxlength="120"></label>
      <label>Correo <input name="customerEmail" type="email" maxlength="160"></label>
      <div class="row">
        <label>Equipos permitidos <input name="maxDevices" type="number" min="1" max="100" value="1" required></label>
        <label>Plan <select name="plan"><option value="Individual">Individual</option><option value="Equipo">Equipo · 3 computadoras</option><option value="Estudio">Estudio · 7 computadoras</option><option value="standard">Personalizado</option></select></label>
      </div>
      <div class="row">
        <label>Vence el <input name="expires" type="date" required value="${toDateInput(Date.now() / 1000 + 30 * DAY)}"></label>
        <div class="fixed" style="display:flex;gap:6px;align-items:end">
          <button type="button" class="btn small" data-d="30">1 mes</button>
          <button type="button" class="btn small" data-d="90">3 meses</button>
          <button type="button" class="btn small" data-d="365">1 año</button>
        </div>
      </div>
      <div class="row">
        <label>Prueba corta: minutos <input name="minutes" type="number" min="1" max="525600" placeholder="vacío = usar la fecha"></label>
        <div class="fixed" style="display:flex;gap:6px;align-items:end">
          <button type="button" class="btn small" data-m="2">2 min</button>
          <button type="button" class="btn small" data-m="10">10 min</button>
          <button type="button" class="btn small" data-m="60">1 hora</button>
        </div>
      </div>
      <label>Notas internas <textarea name="notes" maxlength="1000"></textarea></label>
      <div class="err" id="e" role="alert"></div>
      <div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Crear licencia</button></div>
    </form>`);
  setupCustomerPicker(m, customer);
  m.$('[name=plan]').onchange=e=>{const n={Individual:1,Equipo:3,Estudio:7}[e.target.value];if(n)m.$('[name=maxDevices]').value=n;};
  m.root.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { m.$('[name=minutes]').value = b.dataset.m; });
  m.root.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { m.$('[name=expires]').value = toDateInput(Date.now() / 1000 + Number(b.dataset.d) * DAY); });
  m.$('#cancel').onclick = m.close;
  m.$('#f').onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    if(m.$('#linkAccount').checked&&!fd.customerId){m.$('#e').textContent='Selecciona un usuario de los resultados de búsqueda.';return;}
    const submit=m.$('button[type=submit]');submit.disabled=true;
    try {
      const body = { ...fd, maxDevices: Number(fd.maxDevices) };
      if (Number(fd.minutes) > 0) body.minutes = Number(fd.minutes); else body.expiresAt = endOfDay(fd.expires);
      const r = await api('/licenses', { method: 'POST', body });
      m.close(); showKey(r.key, 'Licencia creada'); route();
    } catch (err) { m.$('#e').textContent = err.message; submit.disabled=false; }
  };
}

async function openDetail(id) {

    const d = await api('/licenses/' + id);
    const l = d.license;
    const activeDevices = d.devices.filter((x) => x.status === 'active');
    m.root.querySelector('.modal').innerHTML = `${dwHead({ icon: adminGlyph('key'), kicker: 'LICENCIA', title: l.customerName, sub: l.customerEmail || 'Sin correo', meta: `${badge(l.state)}<span class="dw-tag">${esc(l.plan)}</span><span class="dw-tag mono">XPBM-…${esc(l.keyHint)}</span>` })}
      <div class="dw-body">
        <dl class="dw-facts">
          <div><dt>Vence</dt><dd>${l.accessMode === 'free' || l.expiresAt >= 253402300799 ? 'Sin vencimiento<br><small>plan gratuito mensual</small>' : fmtDateTime(l.expiresAt) + '<br><small>' + fmtLeft(l.expiresAt) + '</small>'}</dd></div>
          <div><dt>Equipos</dt><dd>${activeDevices.length} de ${l.maxDevices}<br><small>en uso</small></dd></div>
          <div><dt>Plan</dt><dd>${esc(l.plan)}</dd></div>
          <div><dt>Creada</dt><dd>${fmtDateTime(l.createdAt)}</dd></div>
        </dl>
        ${l.notes ? `<section class="dw-card"><header><h4>Notas internas</h4></header><div class="dw-pad"><p style="color:var(--ink-secondary)">${esc(l.notes)}</p></div></section>` : ''}
        <div class="dw-actions">
          <button class="btn" id="aEdit">Editar</button>
          <button class="btn" id="aExt">Extender…</button>
          ${l.status === 'active' ? '<button class="btn" id="aSusp">Suspender</button>' : '<button class="btn" id="aReact">Reactivar</button>'}
          <button class="btn" id="aKey">Regenerar clave</button>
        </div>
        <section class="dw-card"><header><h4>Equipos</h4><span class="muted" style="font-size:12px">${activeDevices.length} activos</span></header>
          ${d.devices.length ? `<div class="dw-list">${d.devices.map((x) => `<div><span class="dev-icon">${adminGlyph('screen')}</span><span class="grow"><b>${esc(x.name) || 'Sin nombre'} ${x.status === 'released' ? badge('released') : ''}</b><small>Revit ${esc(x.revitVersion) || '—'} · v${esc(x.appVersion) || '—'} · último uso ${fmtDateTime(x.lastSeen)}</small></span>${x.status === 'active' ? `<button class="btn small" data-rel="${esc(x.id)}">Liberar</button>` : ''}</div>`).join('')}</div>` : '<div class="dw-empty">Aún no se ha activado en ningún equipo.</div>'}</section>
        <section class="dw-card"><header><h4>Historial</h4></header>
          ${d.events.length ? `<ul class="dw-timeline">${d.events.map((e) => `<li><div><b>${esc(EVENT_LABEL[e.type] || e.type.replace(/_/g, ' ').replace(/^./, (ch) => ch.toUpperCase()))}</b>${e.detail ? `<small>${esc(e.detail)}</small>` : ''}</div><time>${fmtDateTime(e.created_at)}</time></li>`).join('')}</ul>` : '<div class="dw-empty">Sin eventos.</div>'}</section>
        <section class="dw-card dw-danger"><header><h4>Zona de peligro</h4></header>
          <div class="dw-actions">${l.status !== 'revoked' ? '<button class="btn danger-outline" id="aRevoke">Revocar licencia</button>' : ''}<button class="btn danger" id="aDel">${adminGlyph('trash')} Eliminar licencia</button></div>
          <p class="dw-note">Revocar bloquea la clave para siempre pero conserva el registro. Eliminar borra la licencia y libera sus equipos.</p></section>
      </div>`;
    wire(d);
  };
  const act = async (fn, okMsg) => { try { await fn(); if (okMsg) toast(okMsg); await render(); route(); } catch (err) { toast(err.message); } };
  const wire = (d) => {
    const l = d.license, q = (s) => m.root.querySelector(s);
    q('#dwClose').onclick = m.close;
    q('#aEdit').onclick = () => openEdit(l, () => act(async () => {}, 'Guardado'));
    q('#aExt').onclick = async () => {
      const amount = await askDays();
      if (amount) act(() => api(`/licenses/${id}/extend`, { method: 'POST', body: amount }), 'Licencia extendida');
    };
    const ask = async (msg, fn, opts) => { if (await confirmDialog(msg, opts)) fn(); };
    q('#aSusp')?.addEventListener('click', () => ask('¿Suspender? El cliente perderá acceso en su próxima validación.', () => act(() => api('/licenses/' + id, { method: 'PATCH', body: { status: 'suspended' } }), 'Suspendida'), { okLabel: 'Suspender' }));
    q('#aReact')?.addEventListener('click', () => act(() => api('/licenses/' + id, { method: 'PATCH', body: { status: 'active' } }), 'Reactivada'));
    q('#aRevoke')?.addEventListener('click', () => ask('¿Revocar definitivamente esta licencia?', () => act(() => api('/licenses/' + id, { method: 'PATCH', body: { status: 'revoked' } }), 'Revocada'), { danger: true, okLabel: 'Revocar' }));
    q('#aKey').onclick = () => ask('La clave actual dejará de funcionar. Los equipos deberán volver a activarse con la nueva. ¿Continuar?', async () => {
      try { const r = await api(`/licenses/${id}/regenerate-key`, { method: 'POST' }); showKey(r.key, 'Nueva clave'); await render(); route(); } catch (err) { toast(err.message); }
    }, { okLabel: 'Regenerar' });
    q('#aDel').onclick = () => ask('Se eliminará la licencia y sus equipos. Esta acción no se puede deshacer.', () => act(async () => { await api('/licenses/' + id, { method: 'DELETE' }); m.close(); }, 'Eliminada'), { danger: true, okLabel: 'Eliminar' });
    m.root.querySelectorAll('[data-rel]').forEach((b) => b.onclick = () => ask('¿Liberar este equipo? Podrá activarse otro en su lugar.', () => act(() => api(`/licenses/${id}/devices/${b.dataset.rel}/release`, { method: 'POST' }), 'Equipo liberado'), { okLabel: 'Liberar' }));
  };
  try { await render(); } catch (err) { m.root.querySelector('.modal').innerHTML = `<div class="dw-body"><p class="err">${esc(err.message)}</p><button class="btn" id="dwClose">Cerrar</button></div>`; m.$('#dwClose').onclick = m.close; }
}

function openEdit(l, done) {
  const m = openModal(`
    <h3>Editar licencia</h3>
    <form id="f" style="display:grid;gap:12px">
      <label>Cliente <input name="customerName" required maxlength="120" value="${esc(l.customerName)}"></label>
      <label>Correo <input name="customerEmail" type="email" maxlength="160" value="${esc(l.customerEmail)}"></label>
      <div class="row">
        <label>Equipos permitidos <input name="maxDevices" type="number" min="1" max="100" value="${l.maxDevices}" required></label>
        <label>Plan <input name="plan" maxlength="40" value="${esc(l.plan)}"></label>
      </div>
      <label>Vence el <input name="expires" type="date" required value="${toDateInput(l.expiresAt)}"></label>
      <label>Notas internas <textarea name="notes" maxlength="1000">${esc(l.notes)}</textarea></label>
      <div class="err" id="e" role="alert"></div>
      <div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>
    </form>`);
  m.$('#cancel').onclick = m.close;
  m.$('#f').onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const expiresAt = fd.expires === toDateInput(l.expiresAt) ? l.expiresAt : endOfDay(fd.expires);
    try {
      await api('/licenses/' + l.id, { method: 'PATCH', body: { customerName: fd.customerName, customerEmail: fd.customerEmail, plan: fd.plan, notes: fd.notes, maxDevices: Number(fd.maxDevices), expiresAt } });
      m.close(); done();
    } catch (err) { m.$('#e').textContent = err.message; }
  };
}

/* ---------- orders ---------- */
async function renderOrders(view) {
  const f = state.ord;
  const data = await api('/orders?' + new URLSearchParams({ status: f.status, page: f.page }));
  view.innerHTML = `
    <div class="head"><h2>Pedidos</h2></div>
    <div class="toolbar">
      <select id="ost" aria-label="Estado del pedido">
        ${[['pending', 'Pendientes de pago'], ['processing', 'Verificando pago'], ['paid', 'Pagados'], ['cancelled', 'Cancelados'], ['', 'Todos']].map(([v, l]) => `<option value="${v}" ${f.status === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="panel">
      ${data.orders.length ? `<div class="tablewrap"><table><thead><tr><th>Código</th><th>Cliente</th><th>Plan</th><th>Monto</th><th>Tipo</th><th>Estado</th><th>Creado</th><th></th></tr></thead><tbody>
        ${data.orders.map((o) => `<tr><td class="mono"><b>${esc(o.code)}</b></td>
          <td>${esc(o.customerName)}<div class="muted">${esc(o.customerEmail)}</div></td>
          <td>${esc(o.planName)}</td><td>${fmtMoney(o.amountCents, o.currency)}</td><td>${o.kind === 'trial' ? 'Prueba' : o.kind === 'renew' ? 'Renovación' : 'Nueva'}</td>
          <td>${orderBadge(o.status)}${o.providerRef ? `<div class="muted mono" style="font-size:11px">${esc(o.providerRef)}</div>` : ''}</td><td>${fmtDateTime(o.createdAt)}</td>
          <td>${(o.status === 'pending' || o.status === 'processing') ? `<button class="btn small primary" data-ap="${esc(o.id)}">Aprobar pago</button> <button class="btn small" data-cx="${esc(o.id)}">Cancelar</button>` : (o.licenseId ? `<button class="btn small" data-lic="${esc(o.licenseId)}">Ver licencia</button>` : '')}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">No hay pedidos en este estado.</div>'}
      <div class="pager"><button class="btn small" id="prev" ${f.page === 0 ? 'disabled' : ''}>Anterior</button><button class="btn small" id="next" ${data.hasMore ? '' : 'disabled'}>Siguiente</button></div>
    </div>`;
  $('#ost').onchange = (e) => { f.status = e.target.value; f.page = 0; route(); };
  $('#prev').onclick = () => { f.page--; route(); };
  $('#next').onclick = () => { f.page++; route(); };
  view.querySelectorAll('[data-lic]').forEach((b) => b.onclick = () => openDetail(b.dataset.lic));
  view.querySelectorAll('[data-ap]').forEach((b) => b.onclick = async () => {
    if (!await confirmDialog('Confirme que recibió el pago. Se creará o renovará la licencia del cliente.', { okLabel: 'Aprobar pago' })) return;
    try { await api(`/orders/${b.dataset.ap}/approve`, { method: 'POST' }); toast('Pago aprobado'); route(); } catch (err) { toast(err.message); }
  });
  view.querySelectorAll('[data-cx]').forEach((b) => b.onclick = async () => {
    if (!await confirmDialog('¿Cancelar este pedido?', { danger: true, okLabel: 'Cancelar pedido' })) return;
    try { await api(`/orders/${b.dataset.cx}/cancel`, { method: 'POST' }); toast('Pedido cancelado'); route(); } catch (err) { toast(err.message); }
  });
}

/* ---------- events ---------- */
async function renderEvents(view) {
  const f = state.ev;
  const data = await api('/events?' + new URLSearchParams({ type: f.type, page: f.page }));
  view.innerHTML = `
    <div class="head"><h2>Actividad</h2></div>
    <div class="toolbar">
      <select id="type" aria-label="Tipo de evento">
        <option value="">Todos los eventos</option>
        ${Object.entries(EVENT_LABEL).map(([k, v]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}
      </select>
    </div>
    <div class="panel">
      ${data.events.length ? `<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Evento</th><th>Licencia</th><th>Detalle</th><th>IP</th></tr></thead><tbody>
        ${data.events.map((e) => `<tr><td>${fmtDateTime(e.created_at)}</td><td>${esc(EVENT_LABEL[e.type] || e.type)}</td>
        <td>${e.license_id ? `<a href="#" data-lic="${esc(e.license_id)}">${esc(e.customer_name || '')}</a>` : '—'}</td><td class="muted">${esc(e.detail)}</td><td class="mono muted">${esc(e.ip)}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">Sin eventos.</div>'}
      <div class="pager"><button class="btn small" id="prev" ${f.page === 0 ? 'disabled' : ''}>Anterior</button><button class="btn small" id="next" ${data.hasMore ? '' : 'disabled'}>Siguiente</button></div>
    </div>`;
  $('#type').onchange = (e) => { f.type = e.target.value; f.page = 0; route(); };
  $('#prev').onclick = () => { f.page--; route(); };
  $('#next').onclick = () => { f.page++; route(); };
  view.querySelectorAll('[data-lic]').forEach((a) => a.onclick = (e) => { e.preventDefault(); openDetail(a.dataset.lic); });
}

/* ---------- boot ---------- */
async function refreshPending() {
  try {
    const st = await api('/stats');
    const el = $('#pendingBadge');
    el.textContent = st.pendingOrders || '';
    el.classList.toggle('hidden', !st.pendingOrders);
  } catch { /* sin insignia */ }
}
setInterval(() => { if (!$('#app').classList.contains('hidden')) refreshPending(); }, 60000);
(async () => {
  try { await api('/me'); showApp(); route(); refreshPending(); } catch { showLogin(); }
})();
})();
</script>
</body>
</html>
